# Publishes the site to GitHub Pages.
#
# Why this exists: sing-chen.github.io/amplifiedthinker is a supported production
# origin, not a mirror — some corporate networks block amplifiedthinker.com under
# newly-registered-domain policies, so those users reach the site only there.
#
# Before Phase 2, Pages served the repository root directly, which worked only
# because the site was loose static files. Now that the pages live in `public/` and
# the site is built, Pages needs a real build step. Requires the repository's Pages
# source to be set to "GitHub Actions" (Settings -> Pages -> Build and deployment).
#
# ASTRO_BASE is the one difference from the Vercel build: Pages serves this project
# at /amplifiedthinker/, so generated pages need that prefix. The 16 hand-written
# pages are unaffected either way — they use relative links throughout.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets the workflow be run against a branch before merging, so Pages can be
  # verified without production depending on it.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deployments race. Queue rather than cancel, so a merge is
# not left with a half-finished deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          ASTRO_BASE: /amplifiedthinker

      # Fails the build rather than deploying a site with no home page — the exact
      # failure this workflow exists to prevent.
      - name: Verify the build produced the existing pages
        run: |
          set -e
          for f in index.html about.html future-skills.html my-people.html news.html \
                   search.html nav.js progress.js styles.css news.json \
                   skills/analytical-thinking/plan.html \
                   build.json skills-catalogue.json; do
            test -f "dist/$f" || { echo "MISSING: dist/$f"; exit 1; }
          done
          echo "All expected files present in dist/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
